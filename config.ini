[workload analyzer]
#queries file 
# ./workload analyzer/workloads/res.wg
# ./benchmark_queries/tpcds_all.sql
# ./benchmark_queries/job_all.sql
workload_file=./benchmark_queries/tpcds_all.sql
#database schema file
config_file=./workload analyzer/workloads/tpcds.json
#workload features file
output_file=./workload analyzer/workload_features

[knob selector]
api_key=sk-ws-H.RXPDHXH.PJIt.MEQCICToZbVDl8fvf_UuUosmehC2w1zIwJSYqnWoOw2Ot1jVAiBZvgsw-d8MXA-6xIdXetGpK1m3uL9L6YdjSXxWXP9Hvw
base_url=https://llm-hemytdofcdo4f00h.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
model=qwen3.7-plus
#candidata knobs file
candidate_knobs=./knob selector/candidate_knobs
#the number of selected parameters
knob_num=20
#database and hardware info
database_kernel=MySQL 8.0
hardware=8 cores, 16 GB RAM
database_scale=1GB

output_file=./knob selector/selected_knobs

[range pruner]
#candidata knobs with detailed description
knob_details=./range pruner/knob_details.json
#LLM configuration
model=qwen3.7-plus
#knobs with pruned range
output_file=./range pruner/pruned_knobs

[configuration recommender]
#LLM configuration
model=qwen3.7-plus
#tree-search configuration (kept small for fast validation)
top_k=1
node_count=1
#memory window size
history_num=5
#inner metrics
metric_file=./configuration recommender/inner_metric
#Performance indicators to be optimized
db_metric=throughput
#LLM_server configuration
LLM_server_IP=127.0.0.1
LLM_server_port=4000
#DB_client configuration
DB_IP=127.0.0.1
DB_IP_Password=123456
#database configuration
DB_User=root
DB_Password=123456
DB_Host=localhost

# sbtest/tpcds/imdbload
DB_Name=tpcds
DB_Port=3306
#iteration (number of workload replies) — capped for smoke
iteration=3
#benchmarks (TPCC,TPCDS,SYSBENCH,JOB)
benchmark=TPCDS

# Fast smoke protocol (restore to 1/3 for formal experiments)
benchmark_warmup_runs=0
benchmark_repetitions=1
benchmark_require_all=false
statement_timeout_ms=120000
expected_statement_count=0
post_restart_stabilization_sec=5
random_seed=42

# Adaptive decision controller
adaptive_controller_enabled=true
benchmark_budget=5
token_budget=2000000
plateau_window=4
plateau_threshold=0.01
failure_rate_threshold=0.35

# Risk-aware surrogate pre-screen
surrogate_enabled=true
surrogate_min_samples=3
surrogate_candidate_pool=8
surrogate_beta=1.5
surrogate_failure_threshold=0.75
surrogate_exploration_slots=1

# Cost-aware incremental reflection
reflection_enabled=true
reflection_summary_interval=5
reflection_recent_limit=5
reflection_pinned_limit=6
reflection_metric_highlights=8
reflection_max_history_chars=8000
token_log_path=token_usage.jsonl

# run_mode: auto | resume | fresh
# auto   = resume if incomplete checkpoint exists, else start fresh
# resume = require incomplete checkpoint and continue
# fresh  = ignore checkpoint and start a new run in record_dir
run_mode=fresh
# experiment output directory under ./configuration recommender/
# e.g. record-1, record-2 — change this to keep each run separate
record_dir=record-tpcds

[admtune]
enabled=true
# Keep small for fast validation; raise to 100 for full experiments
n_exec_max=5
prescreen_enabled=true
risk_threshold=0.75
conf_threshold=0.2
reflection_mode=conditional_delta
trigger_improve_delta=0.03
trigger_stagnation=4
variant=admtune_full
dynamic_workload=false
