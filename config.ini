[workload analyzer]
#queries file 
# ./workload analyzer/workloads/res.wg
# ./benchmark_queries/tpcds_all.sql
# ./benchmark_queries/job_all.sql
workload_file=./benchmark_queries/tpcds_all.sql
#database schema file
config_file=./workload analyzer/workloads/tpcds.json
#workload features file
output_file=./workload analyzer/workload_features

[knob selector]
api_key=sk-ws-H.RXPDHXH.PJIt.MEQCICToZbVDl8fvf_UuUosmehC2w1zIwJSYqnWoOw2Ot1jVAiBZvgsw-d8MXA-6xIdXetGpK1m3uL9L6YdjSXxWXP9Hvw
base_url=https://llm-hemytdofcdo4f00h.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
model=qwen3.7-plus
#candidata knobs file
candidate_knobs=./knob selector/candidate_knobs
#the number of selected parameters
knob_num=20
#database and hardware info
database_kernel=MySQL 8.0
hardware=64 cores, 246 GB RAM
database_scale=1GB

output_file=./knob selector/selected_knobs

[range pruner]
#candidata knobs with detailed description
knob_details=./range pruner/knob_details.json
#LLM configuration
model=qwen3.7-plus
#knobs with pruned range
output_file=./range pruner/pruned_knobs

[configuration recommender]
#LLM configuration
model=qwen3.7-plus
#tree-search configuration
top_k=2
node_count=3
#memory window size
history_num=5
#inner metrics
metric_file=./configuration recommender/inner_metric
#Performance indicators to be optimized
db_metric=throughput
#LLM_server configuration
LLM_server_IP=127.0.0.1
LLM_server_port=4000
#DB_client configuration
DB_IP=127.0.0.1
DB_IP_Password=123456
#database configuration
DB_User=root
DB_Password=123456
DB_Host=localhost

# sbtest/tpcds/imdbload
DB_Name=tpcds
DB_Port=3306
#iteration (number of workload replies)
iteration=30
#benchmarks (TPCC,TPCDS,SYSBENCH,JOB)
benchmark=TPCDS

# run_mode: auto | resume | fresh
# auto   = resume if incomplete checkpoint exists, else start fresh
# resume = require incomplete checkpoint and continue
# fresh  = ignore checkpoint and start a new run in record_dir
run_mode=fresh
# experiment output directory under ./configuration recommender/
# e.g. record-1, record-2 — change this to keep each run separate
record_dir=record-tpcds